name: Add Theme

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: add-theme
  cancel-in-progress: false

jobs:
  add:
    if: startsWith(github.event.issue.title, 'Theme:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check and add the theme
        id: add
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: python scripts/add_theme.py
      - name: Commit
        if: steps.add.outputs.added == 'true'
        run: |
          git config user.name "MarkLens Gallery Bot"
          git config user.email "gallery-bot@users.noreply.github.com"
          git add MarkLens-Themes
          git commit -m "Add theme: ${{ steps.add.outputs.name }} (#${{ github.event.issue.number }})"
          git push
      - name: Reply
        if: always() && steps.add.outputs.message != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "${{ steps.add.outputs.message }}"
          if [ "${{ steps.add.outputs.added }}" = "true" ]; then
            gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --reason completed
          elif [ "${{ steps.add.outputs.final }}" = "true" ]; then
            gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --reason "not planned"
          fi
